# Streamlit Theme Configuration
# Dokumentation: https://docs.streamlit.io/library/advanced-features/configuration

[theme]
# Primary color (verwendet für Buttons, Links, aktive Elemente)
primaryColor = "hsla(140, 30%, 40%, 1.00)"

# Background color (Haupt-Hintergrund)
backgroundColor = "hsla(240, 10%, 10%, 1.00)"

# Secondary background color (Sidebar, Expander, etc.)
secondaryBackgroundColor = "hsla(240, 10%, 5%, 1.00)"

# Text color (Haupttext)
textColor = "hsla(240, 10%, 85%, 1.00)"

# Font family
font = "sans serif"  # "sans serif", "serif", oder "monospace"


