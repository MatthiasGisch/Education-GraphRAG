# ============================================
# WEITERE EINSTELLUNGEN
# ============================================

[server]
# Port (default: 8501)
# port = 8501

# Wenn true, öffnet sich Browser automatisch
# headless = false

# Max upload size in MB
maxUploadSize = 200

[browser]
# Browser automatisch öffnen
gatherUsageStats = false
